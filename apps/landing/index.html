function endTrip(d){
  d.clock=Math.max(d.clock+3,436);
  Object.keys(d.kids).forEach(id=>{if(d.kids[id].st==='expected'){d.kids[id]={st:'absent',t:d.clock};push(d,'absent',id);}});

}

    else{state.demo.hold=h;paintHold();}
  },55);
}
function holdEnd(){clearInterval(holdTimer);if(state.demo.step==='confirm'&&state.demo.hold>0){state.demo.hold=0;paintHold();}}
function paintHold(){
  const b=document.querySelector('[data-hold]');if(!b)return;
  b.querySelector('[data-fill]').style.width=Math.round(state.demo.hold*100)+'%';
  b.querySelector('[data-label]').style.color=state.demo.hold>0.55?'#fff':'#3346C8';

// ── Derived view values (same rules as the design) ────────────────────────────────────
function vals(){
  const X=DD[lang],dm=state.demo,step=dm.step;
  const ks=Object.entries(dm.kids);
  const cnt={on:ks.filter(([,k])=>k.st==='boarded').length,off:ks.filter(([,k])=>['alighted','absent'].includes(k.st)).length,wait:ks.filter(([,k])=>k.st==='expected').length};
  const firstExp=DK.find(k=>dm.kids[k.id].st==='expected'),firstOn=DK.find(k=>dm.kids[k.id].st==='boarded');
  let next='';if(step==='idle')next='start';else if(step==='active')next=firstExp?'b_'+firstExp.id:firstOn?'a_'+firstOn.id:'end';else if(step==='confirm')next='hold';else if(step==='done')next='again';
  const R=id=>next===id?RING:'none';
  const phase=step==='idle'?0:step==='active'?(firstExp?1:firstOn?2:3):step==='done'?4:3;
  const hk=step==='idle'?'start':step==='active'?(firstExp?'board':firstOn?'alight':'end'):step==='confirm'?'hold':step;
  const stLab=(id,st)=>{const k=K(id);return {expected:[X.drv.exp,'#4A536E','hourglass_top'],boarded:[X.drv.on,'#3346C8','directions_bus'],alighted:[k.off,'#15803D','check_circle'],absent:[k.ab,'#4A536E','do_not_disturb_on']}[st];};
  const dkids=DK.map(({id})=>{const k=K(id),st=dm.kids[id].st,[sl,sc,icon]=stLab(id,st);return {id,...k,sl,sc,icon,open:st==='expected'||st==='boarded',exp:st==='expected',onb:st==='boarded',bd:st==='boarded'?'2px solid #3346C8':'1.5px solid #D5DAE6',ringB:R('b_'+id),ringA:R('a_'+id)};});
  const alertOn=step==='alert';
  const pk=id=>{const k=K(id),s=dm.kids[id],tm=X.t(s.t);
    if(alertOn&&s.st==='boarded')return {pl:X.par.pAlert,pbg:'#A3111B',pfg:'#fff',picon:'warning',head:X.par.notOff,hc:'#A3111B'};
    return {expected:{pl:X.par.pWait,pbg:'#EEF1F8',pfg:'#5B6480',picon:'hourglass_top',head:X.par.wait,hc:'#111833'},boarded:{pl:X.par.pOn,pbg:'#E8EBFB',pfg:'#3346C8',picon:'directions_bus',head:X.par.onSince+' '+tm,hc:'#111833'},
      alighted:{pl:X.par.pSchool,pbg:'#E3F4E8',pfg:'#15803D',picon:'school',head:X.par.atSchool+' '+tm,hc:'#111833'},absent:{pl:X.par.pAbs,pbg:'#EEF1F8',pfg:'#5B6480',picon:'do_not_disturb_on',head:k.ab+' '+X.par.today,hc:'#5B6480'}}[s.st];};
  const EV={board:['directions_bus','#E8EBFB','#3346C8'],alight:['school','#E3F4E8','#15803D'],absent:['do_not_disturb_on','#EEF1F8','#5B6480'],alert:['warning','#A3111B','#fff'],safe:['verified','#E3F4E8','#15803D']};
  const evText=e=>{const f=X.ev[e.type];return typeof f==='function'?f(K(e.kid)):f;};
  const feed=dm.ev.filter(e=>e.parent).slice(-4).reverse().map(e=>{const [icon,bg,fg]=EV[e.type];return {icon,bg,fg,text:evText(e),time:X.t(e.t)};});
  const slog=dm.ev.slice(-6).reverse().map(e=>{const al=e.type==='alert';const ok=['alight','safe','done','resD','resS'].includes(e.type);return {text:evText(e),time:X.t(e.t),dot:al?'#A3111B':ok?'#15803D':e.type==='absent'?'#B9C0D4':'#3346C8',fw:al?700:500,c:al?'#A3111B':'#111833'};});
  const sst={idle:['#EEF1F8','#5B6480'],active:['#E8EBFB','#3346C8'],alert:['#A3111B','#fff'],confirm:['#E8EBFB','#3346C8'],done:['#E3F4E8','#15803D']}[step];
  const banner=dm.banner&&!alertOn?{...dm.banner,ev:EV[dm.banner.type],text:evText(dm.banner)}:null;
  const foc=r=>{const on=state.role===r;return {you:on,order:on?2:1,sh:on?'0 0 0 3px #F5B82E, 0 30px 70px rgba(0,0,0,.45)':'0 24px 60px rgba(0,0,0,.35)'};};
  const fd=foc('d'),fp=foc('g'),fs=foc('s');
  if(state.role==='g'){fd.order=1;fs.order=3;} if(state.role==='s'){fd.order=1;fp.order=3;} if(state.role==='d'){fp.order=1;fs.order=3;}
  const skids=DK.map(({id})=>{const k=K(id),st=dm.kids[id].st,al=alertOn&&st==='boarded';const [sl]=stLab(id,st);const c={expected:['#EEF1F8','#5B6480'],boarded:['#E8EBFB','#3346C8'],alighted:['#E3F4E8','#15803D'],absent:['#EEF1F8','#5B6480']}[st];return {...k,sl:al?X.par.notOff:sl,pbg:al?'#A3111B':c[0],pfg:al?'#fff':c[1]};});
  return {X,dm,step,cnt,dkids,alertOn,pkids:DK.map(({id})=>({...K(id),...pk(id)})),feed,slog,sst,banner,fd,fp,fs,skids,phase,hk,R,
    clock:X.t(dm.clock).split(' ')[0],clockS:X.t(dm.clock)};

      <div style="aspect-ratio:1/1;background:#fff;position:relative;overflow:hidden;border-bottom:1px solid #E1E5EF"><div style="position:absolute;left:50%;bottom:-38%;transform:translateX(-50%);width:88%;aspect-ratio:1/1;border-radius:50%;background:#E8EBFB"></div><img src="${p.src}" alt="${esc(name)}" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:${p.pos}"></div>
      <div style="padding:20px 22px 24px;display:flex;flex-direction:column;gap:4px"><div style="font-size:20px;font-weight:700">${esc(name)}</div><div style="font-size:15px;color:#5B6480">${esc(role)}</div></div></div>`;}).join('')}</div>

const root=document.getElementById('app');
function renderAll(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  root.innerHTML=header()+`<main><section id="top" style="background:#16215C;color:#fff;overflow:hidden">${heroInner()}</section>`+stories()+rest()+'</main>';
}
function renderDemo(){const el=document.getElementById('top');if(el)el.innerHTML=heroInner();}

// One listener for every button; the page re-renders the part that changed.
root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const [a,arg]=b.dataset.act.split(':');
  if(a==='lang'){lang=lang==='ar'?'en':'ar';try{localStorage.setItem('tammene-landing-lang',lang);}catch(err){}renderAll();return;}
  if(a==='role'){state.role=arg;renderDemo();return;}
  if(a==='faq'){const i=+arg;state.faq=state.faq===i?-1:i;renderAll();return;}
  if(a==='board')return actions.tap(arg,'boarded');
  if(a==='alight')return actions.tap(arg,'alighted');
  if(a==='absent')return actions.tap(arg,'absent');
  if(actions[a])actions[a]();
});
// "Bus is empty" is press-and-hold, by pointer or by keyboard (Space / Enter).
root.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-hold]');if(!b)return;e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(err){}holdStart();});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>root.addEventListener(n,e=>{if(e.target.closest&&e.target.closest('[data-hold]'))holdEnd();}));
root.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&e.target.closest('[data-hold]')){e.preventDefault();if(!e.repeat)holdStart();}});
root.addEventListener('keyup',e=>{if((e.key===' '||e.key==='Enter')&&e.target.closest('[data-hold]'))holdEnd();});
root.addEventListener('contextmenu',e=>{if(e.target.closest('[data-hold]'))e.preventDefault();});

renderAll();
</script>
</body>
