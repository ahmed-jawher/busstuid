name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint + secret scan
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Integration tests start real PostgreSQL 16 via embedded-postgres (no Docker needed).
      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=./packages/*

      - name: Install Chromium
        run: pnpm --filter @wusool/e2e exec playwright install --with-deps chromium

      # PLAN §16: the four end-to-end scenarios through the real UI on a 375 px screen.
      - name: End-to-end tests
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            apps/e2e/screenshots
            apps/e2e/test-results
          if-no-files-found: ignore

  # Production images and a smoke test of the whole stack through Caddy (docs/DEPLOY.md).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate a throwaway production env
        run: node scripts/prod-env.mjs --domain :80

      - name: Build and start the stack
        run: docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d --build --wait --wait-timeout 300

      - name: Smoke test through Caddy
        run: |
          curl -fsS http://localhost/v1/health | tee /dev/stderr | grep '"database":"up"'
          curl -fsS http://localhost/ | grep -q 'طمّني'
          curl -fsS http://localhost/trip/some-deep-link | grep -q '<div id="root">'
          curl -fsSI http://localhost/ | grep -qi 'content-security-policy'
          docker compose -f infra/docker-compose.prod.yml --env-file .env.production exec -T backup node dist/ops/cli.js backup
          docker compose -f infra/docker-compose.prod.yml --env-file .env.production exec -T backup sh -c 'ls -l /backups && ls /backups | grep -q ".dump.enc$"'

      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.prod.yml --env-file .env.production logs --tail 200

      - name: Stop
        if: always()
        run: docker compose -f infra/docker-compose.prod.yml --env-file .env.production down -v

  # Android shell (phase 6): proves the Capacitor project compiles and produces a debug APK.
  # Runs on GitHub's runner, which ships the Android SDK; no signing keys or Firebase file.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=./packages/*

      # Without the Firebase file the app still builds and runs; only push stops working.
      - name: Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > apps/web/android/app/google-services.json
          node -e "JSON.parse(require('fs').readFileSync('apps/web/android/app/google-services.json','utf8'))"

      - name: Build the web app into the Android project
        env:
          # The deployed server, so the APK is installable and usable as it is.
          VITE_API_URL: ${{ vars.DEPLOY_URL != '' && format('{0}/v1', vars.DEPLOY_URL) || 'https://api.example.invalid/v1' }}
        run: pnpm --filter @wusool/web native:sync

      - name: Build debug APK
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tammeni-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
