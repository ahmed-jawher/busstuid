# iOS App Store build (docs/RELEASE.md §3).
# Actions → iOS release → Run workflow: builds the web app into the iOS shell against the
# production API, archives it signed for the App Store and uploads it to App Store Connect, where
# it appears under TestFlight after Apple's processing (~15 min). Submitting it for review is done
# by hand in App Store Connect. The signed .ipa is also kept as a run artifact.
# Needs secrets IOS_DIST_CERT_P12_BASE64 + IOS_DIST_CERT_PASSWORD (Apple Distribution
# certificate), IOS_PROVISIONING_PROFILE_BASE64 (App Store profile for com.tammene.app),
# ASC_KEY_ID + ASC_ISSUER_ID + ASC_KEY_P8_BASE64 (App Store Connect API key), and the variable
# DEPLOY_URL.
name: iOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shown in the App Store, e.g. 1.0.1 (empty = the one in the project)
        required: false
        default: ''
      upload:
        description: Upload to App Store Connect (off = only build the .ipa)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # Must grow with every upload; the attempt keeps a re-run from reusing a number.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      ARCHIVE: ${{ runner.temp }}/App.xcarchive
      KEYCHAIN: ${{ runner.temp }}/signing.keychain-db
    steps:
      - name: Check configuration
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          UPLOAD: ${{ inputs.upload }}
          VERSION: ${{ inputs.version }}
        run: |
          missing=()
          for name in P12 P12_PASSWORD PROFILE DEPLOY_URL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "$UPLOAD" = "true" ]; then
            for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
              [ -n "${!name}" ] || missing+=("$name")
            done
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets/variables (see docs/RELEASE.md §3): ${missing[*]}"
            exit 1
          fi
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::version must look like 1.0.1"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm exec turbo run build --filter=./packages/*

      - name: Build the web app into the iOS project
        env:
          VITE_API_URL: ${{ vars.DEPLOY_URL }}/v1
        run: pnpm --filter @wusool/web native:sync

      - name: Install the signing certificate and profile
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          printf '%s' "$P12" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROFILE" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if [ "$APP_ID" != "$TEAM_ID.com.tammene.app" ]; then
            echo "::error::The provisioning profile is for $APP_ID, not $TEAM_ID.com.tammene.app"
            exit 1
          fi
          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" > /dev/null 2>&1; then
            echo "::error::This is a development/ad-hoc profile; App Store uploads need an App Store profile"
            exit 1
          fi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Configure the project for the App Store
        working-directory: apps/web
        run: |
          node scripts/ios-signing.mjs "$TEAM_ID" "$PROFILE_UUID"
          # TestFlight and App Store builds talk to APNs production (APNS_ENV=production).
          /usr/libexec/PlistBuddy -c 'Set :aps-environment production' ios/App/App/App.entitlements

      - name: Archive
        working-directory: apps/web/ios/App
        env:
          VERSION: ${{ inputs.version }}
        run: |
          xcodebuild archive -quiet \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ${VERSION:+MARKETING_VERSION="$VERSION"}

      - name: Export the .ipa
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>com.tammene.app</key><string>$PROFILE_UUID</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls "$RUNNER_TEMP/export"/*.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: tammene-ios-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Upload to App Store Connect
        if: inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          VERSION: ${{ inputs.version }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" | tr -d '\r\n ' | base64 --decode > "$KEY"
          /usr/libexec/PlistBuddy -c 'Set :destination upload' "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm "$KEY"
          echo "Build $BUILD_NUMBER${VERSION:+ of version $VERSION} uploaded; it shows in App Store Connect → TestFlight once Apple has processed it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing keychain
        if: always()
        run: |
          [ -f "$KEYCHAIN" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
